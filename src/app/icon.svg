<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The favicon: the same leaf mark the header draws, at tab size.

    Colours are written out rather than referencing the CSS tokens,
    because a favicon is fetched on its own and has no stylesheet.
    They match --color-sage-100 and --color-sage-600 in globals.css; if
    those change, change these too.

    The circle is filled rather than transparent so the mark stays
    legible against a dark browser chrome as well as a light one.
  -->
  <circle cx="16" cy="16" r="15" fill="#e1eae2" />
  <path
    d="M10 22c0-7 5-12 13-12 0 8-5 13-12 13"
    fill="none"
    stroke="#4f7358"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <path d="M10 22l7-7" stroke="#4f7358" stroke-width="2.5" stroke-linecap="round" />
</svg>
